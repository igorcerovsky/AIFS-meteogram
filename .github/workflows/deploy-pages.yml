name: Update Meteograms & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "server/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Automatically updates every 6 hours (02:00, 08:00, 14:00, 20:00 UTC)
    # matching ECMWF and DWD forecast publishing cycles
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch: # Allows clicking "Run workflow" in GitHub Actions anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Generate static meteograms for all presets
        run: |
          python server/generate_static.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
